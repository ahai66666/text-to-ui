name: release

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: "skill, components, tokens, or offline (Windows x64)"
        required: true
        default: "components"

jobs:
  package:
    if: inputs.release_kind != 'offline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm delivery:validate
      - run: pnpm contracts:validate
      - run: pnpm pixso:mapping:test
      - name: Package selected release
        run: |
          mkdir -p release
          case "${{ inputs.release_kind }}" in
            skill) pnpm skill:package ;;
            components) tar -czf release/text-to-ui-components-v0.1.0.tgz packages ;;
            tokens) tar -czf release/text-to-ui-tokens-v0.1.0.tgz packages/tokens ;;
            *) echo "Unknown release kind"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: text-to-ui-${{ inputs.release_kind }}
          path: release/
  offline:
    if: inputs.release_kind == 'offline'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm index:build
      - run: pnpm catalog:check
      - run: pnpm components:selection-receipt:test
      - run: pnpm frameworks:page-generation:test
      - run: pnpm components:strict-html:test
      - run: pnpm exec playwright install chromium
      - run: pnpm skill:offline:package
      - uses: actions/upload-artifact@v4
        with:
          name: text-to-ui-offline-windows-x64
          path: |
            release/text-to-ui-offline-*.zip
            release/text-to-ui-offline-*.zip.sha256
          if-no-files-found: error
